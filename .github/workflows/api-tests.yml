name: Food Truck API Tests

on:
  push:
    paths:
      - server.js
      - middleware/**
      - postman/**
  pull_request:
    paths:
      - server.js
      - middleware/**
      - postman/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      API_KEY: ${{ secrets.FOODTRUCK_API_KEY }}
      TAX_PERCENT: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Food Truck API
        run: npm start > server.log 2>&1 &

      - name: Wait for API health check
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health > /dev/null; then
              echo "Food Truck API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Food Truck API did not become ready within 60 seconds"
          cat server.log
          exit 1

      - name: Remove reports from previous runs
        run: find reports -maxdepth 1 -type f -name '*.html' -delete

      - name: Run functional collection and generate report
        id: functional
        continue-on-error: true
        run: npm run test:api:report

      - name: Run data-driven collection and generate report
        id: data_driven
        continue-on-error: true
        run: npm run test:data

      - name: Upload Newman reports as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-reports
          path: reports/*.html
          if-no-files-found: warn
          retention-days: 30

      - name: Fail workflow when Newman tests fail
        if: steps.functional.outcome == 'failure' || steps.data_driven.outcome == 'failure'
        run: exit 1

      - name: Prepare reports for GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

  deploy-reports:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: api-tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
